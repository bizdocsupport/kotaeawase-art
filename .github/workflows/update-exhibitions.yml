name: Update exhibition data

"on":
  schedule:
    # 毎朝 06:15 JST = 前日 21:15 UTC
    - cron: "15 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art-exhibition-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for fallback sources
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Scan official museum sites
        run: python updater.py

      - name: Build site auto exhibition data
        run: python tools/build_exhibitions_auto_js.py

      - name: Validate generated JavaScript
        run: node --check docs/assets/js/exhibitions-auto.js

      - name: Confirm only generated site file may change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- docs/ || true)"
          if [ -n "$changed" ]; then
            bad="$(printf '%s\n' "$changed" | grep -v '^docs/assets/js/exhibitions-auto\.js$' || true)"
            if [ -n "$bad" ]; then
              echo "ERROR: exhibition automation changed unexpected production files:"
              printf '%s\n' "$bad"
              exit 1
            fi
          fi
          echo "Production diff guard: OK"

      - name: Commit exhibition data changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/exhibitions-auto.json \
            data/exhibitions-source-status.json \
            data/exhibitions-review.md \
            docs/assets/js/exhibitions-auto.js

          if git diff --cached --quiet; then
            echo "No exhibition-data changes. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update exhibition data"
          git push
