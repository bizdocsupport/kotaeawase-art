name: Update exhibition data

"on":
  schedule:
    # 毎朝 06:15 JST = 前日 21:15 UTC
    - cron: "15 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art-production-deploy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for fallback sources
        run: python -m playwright install --with-deps chromium

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Scan official museum sites
        run: python updater.py

      - name: Collect official exhibition image candidates
        run: python tools/exhibition_image_enricher.py

      - name: Build site auto exhibition data
        run: python tools/build_exhibitions_auto_js.py

      - name: Validate generated JavaScript
        run: node --check docs/assets/js/exhibitions-auto.js

      - name: Confirm only generated site file may change
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only -- docs/ || true)"
          if [ -n "$changed" ]; then
            bad="$(printf '%s\n' "$changed" | grep -v '^docs/assets/js/exhibitions-auto\.js$' || true)"
            if [ -n "$bad" ]; then
              echo "ERROR: exhibition automation changed unexpected production files:"
              printf '%s\n' "$bad"
              exit 1
            fi
          fi
          echo "Production diff guard: OK"

      - name: Commit exhibition data changes when needed
        shell: bash
        run: |
          set -euo pipefail
          git add \
            data/exhibitions-auto.json \
            data/exhibitions-source-status.json \
            data/exhibitions-review.md \
            data/exhibition-image-overrides.json \
            data/exhibition-image-review.md \
            docs/assets/js/exhibitions-auto.js

          if git diff --cached --quiet; then
            echo "No exhibition-data changes. Nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update exhibition data"
          git push

      # Publish only the generated JavaScript, not the whole site. No mkdir:
      # the production server already has assets/js/ (FTP 550 if recreated).
      - name: Install lftp for exhibition JS publish
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Publish updated exhibition JS only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_TLS: ${{ secrets.FTP_TLS }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_REMOTE_DIR; do
            if [ -z "${!name:-}" ]; then
              echo "FTP secret missing: $name. JSON/JS committed, but site publish skipped."
              exit 0
            fi
          done
          TLS_COMMANDS="set ftp:ssl-force false; set ftp:ssl-protect-data false;"
          if [ "${FTP_TLS:-false}" = "true" ] || [ "${FTP_TLS:-false}" = "1" ]; then
            TLS_COMMANDS="set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true;"
          fi
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_SERVER" -e "
            set cmd:fail-exit true;
            set net:max-retries 2;
            set net:timeout 20;
            set ftp:passive-mode true;
            $TLS_COMMANDS
            cd "$FTP_REMOTE_DIR";
            cd assets/js;
            put docs/assets/js/exhibitions-auto.js -o exhibitions-auto.js;
            bye
          "
